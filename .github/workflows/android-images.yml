name: Android browser images
on:
  push:
    branches: [feat/android]
    paths: ['.github/workflows/android-images.yml', 'guest/android/pack-system.sh']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
      - uses: actions/cache/restore@v4
        id: erofs
        with:
          path: vendor/toolchain/erofs-utils
          key: android-erofs-${{ hashFiles('guest/tools/erofs-utils.sh', 'guest/tools/erofs-utils-patches/**', 'guest/tools/pins.sh') }}
      - run: bash guest/tools/erofs-utils.sh
      - uses: actions/cache/save@v4
        if: steps.erofs.outputs.cache-hit != 'true'
        with:
          path: vendor/toolchain/erofs-utils
          key: android-erofs-${{ hashFiles('guest/tools/erofs-utils.sh', 'guest/tools/erofs-utils-patches/**', 'guest/tools/pins.sh') }}
      - uses: actions/cache/restore@v4
        id: images
        with:
          path: vendor/android/system/*.zip
          key: android-images-${{ hashFiles('guest/android/images.json') }}
      - run: python3 guest/android/prepare-system.py
      - uses: actions/cache/save@v4
        if: steps.images.outputs.cache-hit != 'true'
        with:
          path: vendor/android/system/*.zip
          key: android-images-${{ hashFiles('guest/android/images.json') }}
      - name: Compress Android disks for browser delivery
        run: bash guest/android/pack-system.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-browser-images
          path: vendor/android/web
          compression-level: 0
          if-no-files-found: warn
