name: Android kernel bring-up
on:
  push:
    branches: [feat/android]
    paths: ['.github/workflows/android-kernel.yml', 'kernel/**', 'guest/android/kernel.config']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-kernel
  cancel-in-progress: false
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      JOBS: '2'
      KW_SMP: '0'
      KW_RELEASE: '1'
      KW_VK: '0'
      KW_VA: '0'
      KW_KERNEL_CONFIG: guest/android/kernel.config
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM and build tools
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null
          echo 'deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm-22.list >/dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clang-22 lld-22 llvm-22 cmake ninja-build flex bison bc m4 e2fsprogs patch zstd
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: |
            vendor/toolchain
            vendor/src/llvm22
            vendor/build/lld22
          key: android-llvm22-${{ hashFiles('kernel/patches/llvm/**') }}
      - run: bun install --frozen-lockfile
      - run: bash kernel/build.sh kernel
      - run: bash kernel/build.sh base
      - name: Verify Binder configuration
        run: |
          for option in CONFIG_ANDROID_BINDER_IPC=y CONFIG_ANDROID_BINDERFS=y; do
            grep -Fx "$option" vendor/build/kernel/.config
          done
      - run: bun run android:prepare
      - name: Require Bionic and Binder prerequisites
        env:
          ANDROID_KERNEL: vendor/build/bundle/unkernel.wasm
        run: bun run android:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-kernel
          path: |
            vendor/build/bundle/unkernel.wasm
            vendor/build/kernel/.config
          if-no-files-found: warn
