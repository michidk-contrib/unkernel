name: Pages
on:
  push:
    branches: [main, feat/android]
  workflow_dispatch:
    inputs:
      kernel_run:
        description: Run containing the Android kernel, including the SMP variant when available
        type: string
        default: '46067269891'
      images_run:
        description: Run containing the compressed Android browser images
        type: string
        default: '46076223205'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run android:prepare
      - uses: actions/download-artifact@v4
        with:
          name: android-kernel
          run-id: ${{ inputs.kernel_run || '46067269891' }}
          github-token: ${{ github.token }}
          path: vendor/android/custom-kernel
      - uses: actions/download-artifact@v4
        with:
          name: android-browser-images
          run-id: ${{ inputs.images_run || '46076223205' }}
          github-token: ${{ github.token }}
          path: vendor/android/web
      - run: bun run typecheck && bun run check:pages
      - run: bun run build:pages
        env:
          ANDROID_KERNEL: ${{ github.workspace }}/vendor/android/custom-kernel/bundle/unkernel.wasm
          UNKERNEL_BUNDLE: ${{ github.workspace }}/vendor/android/custom-kernel/bundle/unkernel.wasm
      - name: Prepare Android first-run data
        run: bun run test:pages
        env:
          ANDROID_EXPORT_SEED: ${{ github.workspace }}/vendor/android/web
          ANDROID_REPORTS: ${{ github.workspace }}/vendor/android/framework-reports/cold
      - name: Build with verified prepared data
        run: bun run build:pages
        env:
          ANDROID_REQUIRE_SEED: '1'
          ANDROID_KERNEL: ${{ github.workspace }}/vendor/android/custom-kernel/bundle/unkernel.wasm
          UNKERNEL_BUNDLE: ${{ github.workspace }}/vendor/android/custom-kernel/bundle/unkernel.wasm
      - name: Verify prepared boot, launcher pixels and pointer input
        run: bun run test:pages
        env:
          ANDROID_DATA_SEED: ${{ github.workspace }}/vendor/android/web
          ANDROID_REPORTS: ${{ github.workspace }}/vendor/android/framework-reports/prepared
      - run: bun test test/android-seed.test.ts test/android-checkpoint.test.ts test/android-boot-assets.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-pages-boot-reports
          path: vendor/android/framework-reports
          if-no-files-found: warn
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
