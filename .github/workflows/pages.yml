name: Pages
on:
  push:
    branches: [main, feat/android]
  workflow_dispatch:
    inputs:
      kernel_run:
        description: Run containing the Android kernel, including the SMP variant when available
        type: string
        default: '46067269891'
      images_run:
        description: Run containing the compressed Android browser images
        type: string
        default: '46076223205'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the minimal Android launcher
        run: |
          sdkmanager 'platforms;android-33' 'build-tools;35.0.0'
          bash guest/android/launcher/build.sh
      - run: bun run android:prepare
      - uses: actions/download-artifact@v4
        with:
          name: android-kernel
          run-id: ${{ inputs.kernel_run || '46067269891' }}
          github-token: ${{ github.token }}
          path: vendor/android/custom-kernel
      - uses: actions/download-artifact@v4
        with:
          name: android-browser-images
          run-id: ${{ inputs.images_run || '46076223205' }}
          github-token: ${{ github.token }}
          path: vendor/android/web
      - run: bun run typecheck && bun run check:pages
      - run: bun run build:pages
        env:
          ANDROID_ALLOW_COLD_BOOT: '1'
          ANDROID_KERNEL: ${{ github.workspace }}/vendor/android/custom-kernel/bundle/unkernel.wasm
          UNKERNEL_BUNDLE: ${{ github.workspace }}/vendor/android/custom-kernel/bundle/unkernel.wasm
      - name: Prepare Android first-run data
        run: bun run test:pages
        env:
          ANDROID_EXPORT_SEED: ${{ github.workspace }}/vendor/android/web
          ANDROID_REPORTS: ${{ github.workspace }}/vendor/android/framework-reports/cold
      - name: Build with verified prepared data
        run: bun run build:pages
        env:
          ANDROID_REQUIRE_SEED: '1'
          ANDROID_KERNEL: ${{ github.workspace }}/vendor/android/custom-kernel/bundle/unkernel.wasm
          UNKERNEL_BUNDLE: ${{ github.workspace }}/vendor/android/custom-kernel/bundle/unkernel.wasm
      - name: Verify prepared boot, launcher pixels and pointer input
        run: bun run test:pages
        env:
          ANDROID_DATA_SEED: ${{ github.workspace }}/vendor/android/web
          ANDROID_REPORTS: ${{ github.workspace }}/vendor/android/framework-reports/prepared
      - name: Capture and verify prebooted Android
        run: timeout 1100 node guest/android/checkpoint-probe.ts
        env:
          ANDROID_DATA_SEED: ${{ github.workspace }}/vendor/android/web
          ANDROID_EXPORT_CHECKPOINT: ${{ github.workspace }}/vendor/android/startup-source
          ANDROID_WISP: wss://wisp.mercurywork.shop/
      - name: Compress prebooted Android for Pages
        run: bun scripts/pack-android-startup.ts
        env:
          ANDROID_STARTUP_SOURCE: ${{ github.workspace }}/vendor/android/startup-source
          ANDROID_STARTUP: ${{ github.workspace }}/vendor/android/startup
      - name: Package prebooted startup
        run: bun run build:pages
        env:
          ANDROID_REQUIRE_SEED: '1'
          ANDROID_STARTUP: ${{ github.workspace }}/vendor/android/startup
          ANDROID_KERNEL: ${{ github.workspace }}/vendor/android/custom-kernel/bundle/unkernel.wasm
          UNKERNEL_BUNDLE: ${{ github.workspace }}/vendor/android/custom-kernel/bundle/unkernel.wasm
      - name: Verify prebooted HTTP startup and Android internet input
        run: |
          PORT=3000 bun scripts/serve-pages.ts > /tmp/android-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in $(seq 30); do
            if curl --fail --silent http://127.0.0.1:3000/android/boot.json > /dev/null; then break; fi
            sleep 1
          done
          ANDROID_STARTUP_ORIGIN=http://127.0.0.1:3000/ timeout 240 node guest/android/startup-probe.ts
      - run: bun test test/android-startup.test.ts test/android-seed.test.ts test/android-checkpoint.test.ts test/android-boot-assets.test.ts test/android-asset-cache.test.ts test/android-network-settings.test.ts test/android-apk.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-pages-boot-reports
          path: vendor/android/framework-reports
          if-no-files-found: warn
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
